<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Retro gaming console</title>
  <desc id="description">A stylized translucent handheld console with colorful controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170a35"/>
      <stop offset="0.48" stop-color="#642b92"/>
      <stop offset="1" stop-color="#e4458e"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ef7ff" stop-opacity=".86"/>
      <stop offset="1" stop-color="#3f78d6" stop-opacity=".78"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#background)"/>
  <circle cx="160" cy="120" r="240" fill="#00e5ff" opacity=".18"/>
  <circle cx="1060" cy="690" r="330" fill="#ffcc48" opacity=".15"/>
  <g transform="translate(390 80) rotate(-6 210 320)">
    <rect width="420" height="650" rx="70" fill="url(#case)" stroke="#d8fbff" stroke-width="10"/>
    <rect x="62" y="70" width="296" height="260" rx="24" fill="#151929" stroke="#7edfeb" stroke-width="10"/>
    <rect x="88" y="95" width="244" height="205" rx="10" fill="#b9e56b"/>
    <path d="M130 190h160M210 110v160" stroke="#719448" stroke-width="8" opacity=".3"/>
    <g fill="#17223d">
      <rect x="78" y="420" width="128" height="42" rx="10"/>
      <rect x="121" y="377" width="42" height="128" rx="10"/>
    </g>
    <circle cx="298" cy="416" r="37" fill="#ffdb47"/>
    <circle cx="345" cy="473" r="37" fill="#ff5d82"/>
    <rect x="160" y="545" width="62" height="16" rx="8" fill="#233056" transform="rotate(-18 191 553)"/>
    <rect x="235" y="545" width="62" height="16" rx="8" fill="#233056" transform="rotate(-18 266 553)"/>
  </g>
  <text x="72" y="90" fill="#fff1fb" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8">RETRO PLAY</text>
